<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Sincronizada TP4 · 3 Participantes (WS) + 1 Pantalla (SSE)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020617;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 8px 16px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }
    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 6px;
      padding: 6px;
      background: #020617;
    }
    .pane {
      display: flex;
      flex-direction: column;
      border: 2px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      background: #0f172a;
    }
    .pane.screen-pane {
      border-color: #10b981;
    }
    .pane-title {
      padding: 4px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      background: #1e293b;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
    }
    .pane.screen-pane .pane-title {
      background: #064e3b;
      color: #6ee7b7;
    }
    iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #0f172a;
    }
  </style>
</head>
<body>
  <header>
    <strong>🎁 TP4 · Demostración en Tiempo Real: 3 Participantes (WebSocket) y 1 Pantalla Compartida (SSE)</strong>
    <span id="demo-status" style="color: #38bdf8; font-weight: 600;">Sincronización en vivo</span>
  </header>
  <div class="grid">
    <div class="pane">
      <div class="pane-title"><span>👤 Participante 1 (WebSocket)</span><span class="host-label"></span></div>
      <iframe id="p1" src="/?demo=p1"></iframe>
    </div>
    <div class="pane">
      <div class="pane-title"><span>👤 Participante 2 (WebSocket)</span><span class="host-label"></span></div>
      <iframe id="p2" src="/?demo=p2"></iframe>
    </div>
    <div class="pane">
      <div class="pane-title"><span>👤 Participante 3 (WebSocket)</span><span class="host-label"></span></div>
      <iframe id="p3" src="/?demo=p3"></iframe>
    </div>
    <div class="pane screen-pane">
      <div class="pane-title"><span>📺 Pantalla En Vivo (Server-Sent Events / EventSource)</span><span class="host-label-screen"></span></div>
      <iframe id="screen" src="/pantalla"></iframe>
    </div>
  </div>
  <script>
    document.querySelectorAll('.host-label').forEach(el => el.textContent = window.location.origin + '/');
    document.querySelectorAll('.host-label-screen').forEach(el => el.textContent = window.location.origin + '/pantalla');
  </script>
</body>
</html>
